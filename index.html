<html lang="zh-TW">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raku's 2026 LCK &amp; LPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #3d2878;
  --ball:    #8577aa;
  --ball-bd: #5a4280;
  --pill:    #6a5e90;
  --text:    #f0eaff;
  --dim:     #b0a0d0;
  --accent:  #c0a8f0;
  --font:    'DotGothic16','Yu Gothic','Microsoft JhengHei','微軟正黑體',monospace;
  --fs-xs:  15px; --fs-sm: 17px; --fs-md: 19px;
  --fs-lg:  21px; --fs-xl: 24px; --fs-2xl: 28px;
}

body { background:var(--bg); font-family:var(--font); color:var(--text); font-size:var(--fs-sm); overflow:hidden; width:100vw; height:100vh; }

#stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
.page  { position:fixed; inset:0; z-index:1; }

/* ── P1 ── */
#page-home { overflow:hidden; }

#filters {
  position:fixed; top:14px; right:14px;
  display:flex; gap:6px; z-index:30; flex-wrap:wrap; justify-content:flex-end;
}
.filter-btn {
  background:#2a1f50; border:2px solid #5a4280; border-radius:6px;
  padding:6px 13px; cursor:pointer; color:var(--text);
  font-family:var(--font); font-size:var(--fs-sm);
  transition:background .2s,border-color .2s;
  display:flex; align-items:center; gap:5px; justify-content:center; white-space:nowrap;
}
.filter-btn img { height:26px; object-fit:contain; }
.filter-btn:hover  { background:#3e2f70; }
.filter-btn.active { background:#4a3888; border-color:#9070d0; }

#home-scroll { width:100%; height:100%; overflow:auto; cursor:grab; scrollbar-width:none; -ms-overflow-style:none; }
#home-scroll:active { cursor:grabbing; }
#home-scroll::-webkit-scrollbar { display:none; }

#arena { position:relative; width:3000px; height:2000px; }

@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-11px)} }

.team-ball {
  position:absolute; border-radius:50%; background:var(--ball); border:3px solid var(--ball-bd);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; user-select:none;
  transition:box-shadow .25s,border-color .25s;
  animation:float 4s ease-in-out infinite; z-index:5;
}
.team-ball:hover { animation-play-state:paused; transform:scale(1.08); box-shadow:0 0 22px rgba(180,150,255,.45); }
.team-ball.active { border-color:#c0a0ff; box-shadow:0 0 30px rgba(190,160,255,.6); }
.team-ball img { width:72%; height:72%; object-fit:contain; }
.team-ball .ball-id { font-size:var(--fs-sm); font-weight:bold; text-align:center; color:var(--text); line-height:1.3; }
.team-ball.ball-other { background:#5e5878; border-color:#807898; }
.team-ball.ball-other .ball-id { font-size:var(--fs-xs); color:var(--dim); }

.quote-bubble {
  position:absolute; background:#1e1540; border:2px solid #7060b0; border-radius:10px;
  padding:8px 13px; font-size:var(--fs-sm); color:var(--text);
  max-width:240px; z-index:20; opacity:0; transform:scale(.85);
  transition:opacity .28s,transform .28s; pointer-events:none; white-space:normal; line-height:1.5;
}
.quote-bubble.show { opacity:1; transform:scale(1); }
.quote-bubble::after { content:''; position:absolute; width:0; height:0; border:9px solid transparent; left:20px; }
.quote-bubble:not(.arrow-up)::after { bottom:-9px; border-top-color:#7060b0; border-bottom-width:0; }
.quote-bubble.arrow-up::after       { top:-9px;    border-bottom-color:#7060b0; border-top-width:0; }

.member-circle {
  position:absolute; display:flex; flex-direction:column; align-items:center; gap:5px;
  z-index:6; opacity:0; transform:scale(.4); transition:opacity .3s,transform .3s; cursor:default;
}
.member-circle.show { opacity:1; transform:scale(1); }
.member-circle.link { cursor:pointer; }
.member-circle.link:hover .mc-avatar { border-color:#d0b8ff; }

.mc-avatar {
  width:120px; height:120px; border-radius:50%;
  background:var(--ball); border:3px solid var(--ball-bd);
  overflow:hidden; display:flex; align-items:center; justify-content:center;
  transition:box-shadow .2s;
}
.mc-avatar img { width:100%; height:100%; object-fit:cover; }
.mc-avatar .mc-initial { font-size:38px; font-weight:bold; color:var(--dim); }
.mc-label { display:flex; align-items:center; gap:5px; font-size:var(--fs-md); color:var(--text); text-shadow:0 1px 4px rgba(0,0,0,.6); white-space:nowrap; }
.mc-label img { width:20px; height:20px; object-fit:contain; }

.member-pill {
  position:absolute; display:flex; align-items:center; gap:10px;
  background:var(--pill); border:2px solid #5a4880; border-radius:12px;
  padding:14px 28px; font-size:var(--fs-xl); z-index:6;
  opacity:0; transform:scale(.4); transition:opacity .3s,transform .3s;
  white-space:nowrap; cursor:default;
}
.member-pill.show { opacity:1; transform:scale(1); }
.member-pill.link { cursor:pointer; }
.member-pill.link:hover { background:#7a6aaa; border-color:#c0a0ff; }
.member-pill img { width:34px; height:34px; object-fit:contain; opacity:.8; }

/* Zoom control */
#zoom-ctrl {
  position:fixed; bottom:18px; right:18px; z-index:30;
  display:flex; align-items:center; gap:6px;
  background:rgba(26,18,58,.88); border:2px solid #5a4280; border-radius:10px;
  padding:7px 12px; backdrop-filter:blur(6px);
  font-family:var(--font); font-size:var(--fs-sm); color:var(--dim); user-select:none;
}
#zoom-ctrl button { background:none; border:none; color:var(--text); cursor:pointer; font-size:20px; line-height:1; padding:0 3px; font-family:monospace; }
#zoom-ctrl button:hover { color:var(--accent); }
#zoom-slider { width:90px; accent-color:#9070d0; cursor:pointer; }
#zoom-label  { width:38px; text-align:center; font-size:var(--fs-xs); }

@media(max-width:600px){
  #zoom-ctrl{bottom:10px;right:10px;padding:6px 10px;gap:5px}
  #zoom-slider{width:65px}
  #filters{top:8px;right:8px;gap:4px}
  .filter-btn{padding:5px 9px;font-size:var(--fs-xs)}
  .filter-btn img{height:20px}
}

/* ── P2 ── */
#page-player { overflow-y:auto; padding:20px 20px 40px; background:var(--bg); display:none; }

.back-btn { background:#2a1f50; border:2px solid #5a4280; border-radius:8px; padding:9px 18px; color:var(--text); font-family:var(--font); font-size:var(--fs-md); cursor:pointer; margin-bottom:18px; transition:background .2s; }
.back-btn:hover { background:#3e2f70; }

.player-card { max-width:520px; margin:0 auto; background:#4a3888; border-radius:16px; padding:24px 24px 28px; }

.p2-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.p2-left { flex:1; margin-right:16px; }
.p2-player-id { font-size:var(--fs-2xl); font-weight:bold; color:#fff; margin-bottom:14px; }
.p2-right { display:flex; flex-direction:column; align-items:flex-end; gap:10px; min-width:100px; }
.p2-icon-badges { display:flex; align-items:center; gap:6px; justify-content:flex-end; }
.p2-badge-logo { height:22px; object-fit:contain; }
.p2-player-icon { width:100px; height:100px; border-radius:50%; background:var(--ball); border:3px solid var(--ball-bd); overflow:hidden; display:flex; align-items:center; justify-content:center; }
.p2-player-icon img { width:100%; height:100%; object-fit:cover; }
.p2-initial { font-size:34px; font-weight:bold; color:var(--dim); }

.speech-bubble { display:inline-block; background:#1e1540; border:2px solid #7060b0; border-radius:10px; padding:9px 14px; font-size:var(--fs-md); line-height:1.5; position:relative; max-width:250px; margin-bottom:12px; }
.speech-bubble::after { content:''; position:absolute; right:-10px; top:13px; width:0; height:0; border:9px solid transparent; border-left-color:#7060b0; border-right:none; }

.tags { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:20px; }
.tag { background:#2a1f50; border:1px solid #7060b0; border-radius:999px; padding:4px 13px; font-size:var(--fs-sm); color:#d0c0f0; }

.section-row { display:flex; align-items:stretch; gap:8px; margin-bottom:20px; }
.side-label { writing-mode:vertical-rl; font-size:var(--fs-xs); color:#a090c0; letter-spacing:3px; padding:4px 0; display:flex; align-items:center; justify-content:center; min-width:20px; }

.info-box { flex:1; border:2px solid #7060b0; border-radius:8px; padding:13px 14px; font-size:var(--fs-sm); line-height:2.1; }
.push-badge { display:inline-block; padding:2px 10px; border-radius:4px; font-size:var(--fs-xs); font-weight:bold; color:#1a1030; }
.stars-text { font-size:var(--fs-xl); letter-spacing:2px; }
.star-on   { color:#ffcc00; }
.star-half { color:#ffcc00; opacity:.45; }
.star-off  { color:#5a4880; }
.notes-list { margin-top:2px; list-style:none; }
.notes-list li { font-size:var(--fs-xs); color:#c0b0e0; line-height:1.7; padding-left:15px; position:relative; }
.notes-list li::before { content:'・'; position:absolute; left:0; }

.img-section-wrap { flex:1; }
.img-group { margin-bottom:12px; }
.img-group-label { font-size:var(--fs-xs); color:var(--accent); margin-bottom:7px; border-left:3px solid var(--accent); padding-left:7px; }
.img-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
.img-cell { height:180px; background:#2a1f50; border-radius:6px; overflow:hidden; border:1px solid #5a4280; cursor:pointer; }
.img-cell:hover { border-color:#9070d0; }
.img-cell img { width:100%; height:100%; object-fit:cover; display:block; transition:opacity .2s; }
.img-cell:hover img { opacity:.85; }

.cp-section { margin-top:4px; }
.cp-title { font-size:var(--fs-lg); color:var(--text); margin-bottom:12px; }
.cp-list  { display:flex; gap:18px; flex-wrap:wrap; }
.cp-ball  { display:flex; flex-direction:column; align-items:center; gap:5px; cursor:default; }
.cp-ball.link { cursor:pointer; }
.cp-ball.link:hover .cp-avatar { border-color:#d0b8ff; }
.cp-avatar { width:68px; height:68px; border-radius:50%; background:var(--ball); border:2px solid var(--ball-bd); overflow:hidden; display:flex; align-items:center; justify-content:center; }
.cp-avatar img { width:100%; height:100%; object-fit:cover; }
.cp-avatar .cp-initial { font-size:var(--fs-sm); color:var(--dim); text-align:center; padding:4px; }
.cp-name { display:flex; align-items:center; gap:3px; font-size:var(--fs-xs); color:var(--text); }
.cp-name img { width:15px; height:15px; object-fit:contain; }

.wip-banner { background:#2a1f50; border:2px dashed #5a4280; border-radius:10px; padding:20px; text-align:center; font-size:var(--fs-md); color:var(--dim); margin-top:10px; }

/* Lightbox */
#lightbox { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:200; display:none; align-items:center; justify-content:center; }
#lightbox.open { display:flex; }
#lightbox-img { max-width:90vw; max-height:88vh; object-fit:contain; border-radius:8px; box-shadow:0 0 40px rgba(0,0,0,.6); }
#lightbox-close { position:absolute; top:16px; right:20px; background:none; border:none; color:#fff; font-size:32px; cursor:pointer; line-height:1; opacity:.8; }
#lightbox-close:hover { opacity:1; }
</style>
</head>

(function(){
  const c=document.getElementById('stars'), ctx=c.getContext('2d'); let s=[];
  function resize(){
    c.width=innerWidth; c.height=innerHeight;
    s=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,a:Math.random()*.45+.15,sp:Math.random()*.0008+.0003,ph:Math.random()*Math.PI*2}));
  }
  function draw(t){
    ctx.clearRect(0,0,c.width,c.height);
    s.forEach(s=>{const a=s.a+Math.sin(t*s.sp*1000+s.ph)*.12;ctx.beginPath();ctx.arc(s.x*c.width,s.y*c.height,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(210,195,255,${Math.max(.05,a)})`;ctx.fill()});
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize); resize(); requestAnimationFrame(draw);
})();

//  HELPERS
// ════════════════════════════════════════════
function getBallSize(team){ return BALL_SIZE[team.importance]||155; }

function seededFloat(seed){ const x=Math.sin(seed*127.1+311.7)*43758.5453; return x-Math.floor(x); }

function memberGlowStyle(pid){
  const p=PLAYERS[pid]; if(!p||!p.stars) return '';
  const r=p.stars/p.maxStars;
  return `box-shadow:0 0 ${(4+r*12).toFixed(0)}px ${(r*5).toFixed(0)}px rgba(200,160,255,${(.1+r*.55).toFixed(2)})`;
}

function renderStars(stars,maxStars){
  const f=Math.floor(stars), h=(stars-f)>=.5?1:0, e=maxStars-f-h;
  return '<span class="star-on">★</span>'.repeat(f)+(h?'<span class="star-half">★</span>':'')+'<span class="star-off">☆</span>'.repeat(Math.max(0,e));
}

function findMember(id){ for(const t of TEAMS){const m=t.members.find(m=>m.id===id);if(m)return m;} return null; }

// ════════════════════════════════════════════
//  SCATTER POSITIONS
// ════════════════════════════════════════════
const posCache={};

function getScatterPositions(key,teams){
  if(posCache[key]) return posCache[key];
  const pos=[], MIN=280, MX=160, MY=160;
  const maxX=ARENA_W-MX-220, maxY=ARENA_H-MY-220;
  teams.forEach((team,i)=>{
    const sz=getBallSize(team), r=sz/2;
    let placed=false;
    for(let a=0;a<400&&!placed;a++){
      const x=MX+seededFloat(i*997+a*31+3)*(maxX-MX);
      const y=MY+seededFloat(i*1009+a*37+7)*(maxY-MY);
      const cx=x+r, cy=y+r;
      if(!pos.some(p=>Math.hypot(cx-p.cx,cy-p.cy)<MIN)){pos.push({x,y,cx,cy});placed=true;}
    }
    if(!placed) pos.push({x:MX+(i%4)*680,y:MY+Math.floor(i/4)*460,cx:MX+(i%4)*680+r,cy:MY+Math.floor(i/4)*460+r});
  });
  posCache[key]=pos; return pos;
}

// Fixed center positions for main view
const MAIN_CX = { GEN:{cx:2060,cy:1350}, DK:{cx:1500,cy:680}, TES:{cx:930,cy:1350}, other:{cx:520,cy:720} };
const MAIN_CENTER = {x:1300, y:1050};

//  P1 STATE
// ════════════════════════════════════════════
const arena=document.getElementById('arena'), homeScroll=document.getElementById('home-scroll');
let currentFilter='main', activeTeamId=null, teamEls={}, currentZoom=.65;

function calcInitZoom(){ return Math.max(.3,parseFloat(Math.min(innerWidth/1900,innerHeight/1300,1).toFixed(2))); }

function scrollToCenter(ax,ay){
  homeScroll.scrollLeft=ax*currentZoom-homeScroll.clientWidth/2;
  homeScroll.scrollTop =ay*currentZoom-homeScroll.clientHeight/2;
}

function setZoom(z,px,py){
  z=Math.min(1.2,Math.max(.2,z));
  const old=currentZoom;
  if(px===undefined){px=(homeScroll.scrollLeft+homeScroll.clientWidth/2)/old;py=(homeScroll.scrollTop+homeScroll.clientHeight/2)/old;}
  currentZoom=z; arena.style.zoom=z;
  homeScroll.scrollLeft=px*z-homeScroll.clientWidth/2;
  homeScroll.scrollTop =py*z-homeScroll.clientHeight/2;
  document.getElementById('zoom-slider').value=z;
  document.getElementById('zoom-label').textContent=Math.round(z*100)+'%';
}

function getVisibleTeams(){
  if(currentFilter==='main')   return ['GEN','DK','TES','other'].map(id=>TEAMS.find(t=>t.id===id));
  if(currentFilter==='all')    return TEAMS.filter(t=>t.id!=='other');
  if(currentFilter==='important') return TEAMS.filter(t=>t.importance>=2&&t.id!=='other');
  return TEAMS.filter(t=>t.league===currentFilter);
}

// ════════════════════════════════════════════
//  RENDER TEAMS
// ════════════════════════════════════════════
function renderTeams(){
  arena.innerHTML=''; teamEls={}; activeTeamId=null;
  const visible=getVisibleTeams(), isScatter=currentFilter!=='main';
  const positions=isScatter?getScatterPositions(currentFilter,visible):null;

  visible.forEach((team,i)=>{
    const isOther=team.id==='other';
    const sz=getBallSize(team), r=sz/2;
    const {cx,cy}=isScatter?positions[i]:(MAIN_CX[team.id]||{cx:300+i*400,cy:600});
    const x=cx-r, y=cy-r;
    const delay=(i*.6).toFixed(2)+'s';

    const ball=document.createElement('div');
    ball.className='team-ball'+(isOther?' ball-other':'');
    ball.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;animation-delay:${delay}`;
    ball.dataset.cx=cx; ball.dataset.cy=cy;

    if(team.logo){const img=document.createElement('img');img.src=team.logo;img.alt=team.name;ball.appendChild(img);}
    else{const sp=document.createElement('span');sp.className='ball-id';sp.textContent=isOther?'other':team.id;ball.appendChild(sp);}
    ball.addEventListener('click',()=>toggleTeam(team.id));
    arena.appendChild(ball);

    const aboveBall=cy>180;
    const bubble=document.createElement('div');
    bubble.className='quote-bubble'+(aboveBall?'':' arrow-up');
    bubble.textContent=team.quote||team.name;
    bubble.style.cssText=`left:${x}px;top:${aboveBall?y-95:y+sz+14}px`;
    arena.appendChild(bubble);

    teamEls[team.id]={ball,bubble,memberEls:[]};
  });
}

function toggleTeam(id){
  if(activeTeamId===id){collapseTeam(id);activeTeamId=null;}
  else{if(activeTeamId)collapseTeam(activeTeamId);activeTeamId=id;expandTeam(id);}
}

function collapseTeam(id){
  const el=teamEls[id];if(!el)return;
  el.ball.classList.remove('active'); el.bubble.classList.remove('show');
  el.memberEls.forEach(m=>{m.classList.remove('show');setTimeout(()=>m.remove(),320)});
  el.memberEls=[];
}

function expandTeam(id){
  const team=TEAMS.find(t=>t.id===id), el=teamEls[id];
  if(!team||!el)return;
  el.ball.classList.add('active'); el.bubble.classList.add('show');

  const ballCX=parseFloat(el.ball.dataset.cx), ballCY=parseFloat(el.ball.dataset.cy);
  const goRight=ballCX<ARENA_W*.55, xSign=goRight?1:-1;
  const count=team.members.length;

  team.members.forEach((m,i)=>{
    const yOff=(i-(count-1)/2)*158;
    const xDist=m.hasPage?180:210;
    const jitter=xSign*(i%2?24:0);
    const mx=Math.max(100,Math.min(ARENA_W-250,ballCX+xSign*xDist+jitter));
    const my=Math.max(60, Math.min(ARENA_H-80, ballCY+yOff));

    const memberEl=m.hasPage?makeCircleMember(m,mx,my,i):makePillMember(m,mx,my,i);
    arena.appendChild(memberEl);
    el.memberEls.push(memberEl);
    setTimeout(()=>memberEl.classList.add('show'),60+i*80);
  });
}

function makeCircleMember(m,cx,cy,idx){
  const canLink=m.hasPage&&PLAYERS[m.id];
  const el=document.createElement('div');
  el.className='member-circle'+(canLink?' link':'');
  el.style.cssText=`left:${cx-60}px;top:${cy-60}px;transition-delay:${idx*.04}s`;

  const av=document.createElement('div'); av.className='mc-avatar';
  if(canLink){ const g=memberGlowStyle(m.id); if(g) av.style.cssText=g; }
  if(m.icon){const img=document.createElement('img');img.src=m.icon;img.alt=m.name;av.appendChild(img);}
  else{const init=document.createElement('span');init.className='mc-initial';init.textContent=m.name[0].toUpperCase();av.appendChild(init);}

  const lbl=document.createElement('div');lbl.className='mc-label';
  if(ROLES[m.role]){const ri=document.createElement('img');ri.src=ROLES[m.role];ri.alt=m.role;lbl.appendChild(ri);}
  lbl.appendChild(document.createTextNode(m.name));
  el.appendChild(av);el.appendChild(lbl);
  if(canLink) el.addEventListener('click',e=>{e.stopPropagation();openPlayer(m.id);});
  return el;
}

function makePillMember(m,cx,cy,idx){
  const canLink=m.hasPage&&PLAYERS[m.id];
  const el=document.createElement('div');
  el.className='member-pill'+(canLink?' link':'');
  el.style.cssText=`left:${cx-100}px;top:${cy-31}px;transition-delay:${idx*.04}s`;
  if(ROLES[m.role]){const ri=document.createElement('img');ri.src=ROLES[m.role];ri.alt=m.role;el.appendChild(ri);}
  el.appendChild(document.createTextNode(m.name));
  if(canLink) el.addEventListener('click',e=>{e.stopPropagation();openPlayer(m.id);});
  return el;
}

// ── Filters ──────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    renderTeams();
    const cx=currentFilter==='main'?MAIN_CENTER.x:ARENA_W/2;
    const cy=currentFilter==='main'?MAIN_CENTER.y:ARENA_H/2;
    setTimeout(()=>scrollToCenter(cx,cy),30);
  });
});

// ── Zoom ─────────────────────────────────────
document.getElementById('zoom-slider').addEventListener('input',e=>setZoom(parseFloat(e.target.value)));
document.getElementById('zoom-out').addEventListener('click',()=>setZoom(currentZoom-.1));
document.getElementById('zoom-in' ).addEventListener('click',()=>setZoom(currentZoom+.1));
homeScroll.addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey)return; e.preventDefault();
  const r=homeScroll.getBoundingClientRect();
  setZoom(currentZoom+(e.deltaY>0?-.08:.08),(homeScroll.scrollLeft+e.clientX-r.left)/currentZoom,(homeScroll.scrollTop+e.clientY-r.top)/currentZoom);
},{passive:false});

// ── Pan (mouse) ───────────────────────────────
let drag=null;
homeScroll.addEventListener('mousedown',e=>{if(e.target!==homeScroll&&e.target!==arena)return;drag={x:e.pageX,y:e.pageY,sl:homeScroll.scrollLeft,st:homeScroll.scrollTop};});
window.addEventListener('mousemove',e=>{if(!drag)return;homeScroll.scrollLeft=drag.sl-(e.pageX-drag.x);homeScroll.scrollTop=drag.st-(e.pageY-drag.y);});
window.addEventListener('mouseup',()=>{drag=null;});

// ── Pan + pinch (touch) ───────────────────────
let tp=null,pd=null;
homeScroll.addEventListener('touchstart',e=>{if(e.touches.length===1){tp={x:e.touches[0].clientX,y:e.touches[0].clientY,sl:homeScroll.scrollLeft,st:homeScroll.scrollTop};pd=null;}else if(e.touches.length===2){tp=null;pd=pinchD(e);}},{passive:true});
homeScroll.addEventListener('touchmove',e=>{if(e.touches.length===1&&tp){homeScroll.scrollLeft=tp.sl-(e.touches[0].clientX-tp.x);homeScroll.scrollTop=tp.st-(e.touches[0].clientY-tp.y);}else if(e.touches.length===2&&pd!==null){const d=pinchD(e);setZoom(currentZoom*d/pd);pd=d;}},{passive:true});
homeScroll.addEventListener('touchend',e=>{if(e.touches.length<2)pd=null;if(e.touches.length===0)tp=null;},{passive:true});
function pinchD(e){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.hypot(dx,dy);}

// ════════════════════════════════════════════
//  LIGHTBOX
// ════════════════════════════════════════════
function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }
document.getElementById('lightbox-close').addEventListener('click',closeLightbox);
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

// ════════════════════════════════════════════
//  P2 — PLAYER PAGE
// ════════════════════════════════════════════
function openPlayer(pid){
  const p=PLAYERS[pid];if(!p)return;
  document.getElementById('page-home').style.display='none';
  const page=document.getElementById('page-player');
  page.style.display='block'; page.scrollTop=0;
  document.getElementById('player-content').innerHTML=buildPlayerCard(p);
}

function buildPlayerCard(p){
  if(p.wip){
    return `<div class="player-card">
      <div class="p2-header">
        <div class="p2-left"><div class="p2-player-id">${p.id}（${p.fullName}）</div></div>
        <div class="p2-right">
          <div class="p2-icon-badges">
            ${ROLES[p.role]?`<img src="${ROLES[p.role]}" alt="${p.role}" class="p2-badge-logo">`:''}
            ${LEAGUE_LOGOS[p.league]?`<img src="${LEAGUE_LOGOS[p.league]}" alt="${p.league}" class="p2-badge-logo">`:''}
          </div>
          <div class="p2-player-icon"><span class="p2-initial">${p.id[0]}</span></div>
        </div>
      </div>
      <div class="wip-banner">🚧 施工中 🚧<br>此頁面尚未完成，敬請期待</div>
    </div>`;
  }

  const color=PUSH_COLORS[p.pushCategory]||'#ccc';
  const imgGroupsHTML=p.imageGroups.filter(g=>g.files&&g.files.length>0).map(g=>`
    <div class="img-group">
      <div class="img-group-label">${g.label}</div>
      <div class="img-grid">${g.files.map(f=>`<div class="img-cell" onclick="openLightbox('${f}')"><img src="${f}" alt="${g.label}" loading="lazy"></div>`).join('')}</div>
    </div>`).join('');

  const cpHTML=p.cp.map(cpId=>{
    const cpM=findMember(cpId),cpP=PLAYERS[cpId];
    const link=cpP?' link':'',onclick=cpP?`onclick="openPlayer('${cpId}')"`:'';;
    const avatar=cpM?.icon?`<img src="${cpM.icon}" alt="${cpId}">`:`<div class="cp-initial">${cpId[0]}</div>`;
    const roleImg=cpM?`<img src="${ROLES[cpM.role]}" alt="${cpM.role}">`:'';;
    return `<div class="cp-ball${link}" ${onclick}><div class="cp-avatar">${avatar}</div><div class="cp-name">${roleImg}${cpId}</div></div>`;
  }).join('');

  return `<div class="player-card">
    <div class="p2-header">
      <div class="p2-left">
        <div class="p2-player-id">${p.id}（${p.fullName}）</div>
        <div class="speech-bubble">${p.quote}</div>
        <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="p2-right">
        <div class="p2-icon-badges">
          ${ROLES[p.role]?`<img src="${ROLES[p.role]}" alt="${p.role}" class="p2-badge-logo">`:''}
          ${LEAGUE_LOGOS[p.league]?`<img src="${LEAGUE_LOGOS[p.league]}" alt="${p.league}" class="p2-badge-logo">`:''}
        </div>
        <div class="p2-player-icon">${p.icon?`<img src="${p.icon}" alt="${p.id}">`:`<span class="p2-initial">${p.id[0]}</span>`}</div>
      </div>
    </div>
    <div class="section-row">
      <div class="info-box">
        <div>我的暱稱：${p.nickname||'—'}</div>
        <div>生日：${p.birthday||'—'}</div>
        <div>推度分類：${p.pushCategory?`<span class="push-badge" style="background:${color}">${p.pushCategory}</span>`:'—'}</div>
        <div>重要程度（1-${p.maxStars} 星）：<span class="stars-text">${renderStars(p.stars,p.maxStars)}</span></div>
        <div>自由發揮：<ul class="notes-list">${p.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>
      </div>
      <div class="side-label">資訊區</div>
    </div>
    ${imgGroupsHTML?`<div class="section-row"><div class="img-section-wrap">${imgGroupsHTML}</div><div class="side-label">圖片區</div></div>`:''}
    ${p.cp.length?`<div class="cp-section"><div class="cp-title">我嗑的 CP</div><div class="cp-list">${cpHTML}</div></div>`:''}
  </div>`;
}

document.getElementById('back-btn').addEventListener('click',()=>{
  document.getElementById('page-player').style.display='none';
  document.getElementById('page-home').style.display='block';
});

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
currentZoom=calcInitZoom();
arena.style.zoom=currentZoom;
document.getElementById('zoom-slider').value=currentZoom;
document.getElementById('zoom-label').textContent=Math.round(currentZoom*100)+'%';
renderTeams();
setTimeout(()=>scrollToCenter(MAIN_CENTER.x,MAIN_CENTER.y),50);
</script>
